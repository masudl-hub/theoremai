name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install dependencies
        run: deno install

      - name: Install npm lint tools
        run: npm ci

      - name: Docs truth
        run: npm run lint:docs
        env:
          THEOREM_DOCS_BASE: origin/${{ github.base_ref || github.event.repository.default_branch }}

      - name: Deno lint
        run: deno lint

      - name: Biome
        run: npm run lint:biome

      - name: ast-grep
        run: npm run lint:ast-grep

      - name: Fallow
        run: npm run lint:fallow
        env:
          FALLOW_AUDIT_BASE: origin/${{ github.base_ref || github.event.repository.default_branch }}

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install dependencies
        run: deno install

      - name: Install npm dependencies
        run: npm ci

      - name: Type check
        run: deno check mod.ts tests/fixtures/probes/ scripts/*.ts

      - name: Type check react
        run: npm run check:react

      - name: Verify publish bundle
        run: deno task verify:publish

      - name: Test
        run: deno task test

  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install dependencies
        run: deno install

      - name: Assert deno.lock is committed
        run: |
          if ! git diff --exit-code deno.lock; then
            echo "::error::deno.lock is out of sync with deno.json. Run 'deno install' and commit deno.lock."
            exit 1
          fi

      - name: Verify publish bundle
        run: deno task verify:publish

      - name: Dry-run JSR publish
        run: deno publish --dry-run

      - name: Build npm package
        run: npm run build:npm

      - name: Dry-run npm publish
        working-directory: npm
        run: |
          npm version "0.0.0-pr.${GITHUB_RUN_ID}" --no-git-tag-version
          npm publish --dry-run --access public --tag ci-validate
