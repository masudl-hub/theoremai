name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: deno install

      - name: Docs truth
        run: npm run lint:docs
        env:
          THEORUM_DOCS_BASE: origin/${{ github.base_ref || github.event.repository.default_branch }}

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check mod.ts

      - name: Verify publish bundle
        run: deno task verify:publish

      - name: Test
        run: deno task test

  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: deno install

      - name: Assert deno.lock is committed
        run: |
          if ! git diff --exit-code deno.lock; then
            echo "::error::deno.lock is out of sync with deno.json. Run 'deno install' and commit deno.lock."
            exit 1
          fi

      - name: Verify publish bundle
        run: deno task verify:publish

      - name: Dry-run JSR publish
        run: deno publish --dry-run

      - name: Build npm package
        run: npm run build:npm

      - name: Dry-run npm publish
        working-directory: npm
        run: |
          npm version "0.0.0-pr.${GITHUB_RUN_ID}" --no-git-tag-version
          npm publish --dry-run --access public --tag ci-validate
