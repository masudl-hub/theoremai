name: CI

on:
  push:
    # A release branch is named for its version (0.3.4); a passing push publishes an npm preview.
    branches: [main, '[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install dependencies
        run: deno install

      - name: Install npm lint tools
        run: npm ci

      - name: Docs truth
        run: npm run lint:docs
        env:
          THEOREM_DOCS_BASE: origin/${{ github.base_ref || github.event.repository.default_branch }}

      - name: Deno lint
        run: deno lint

      - name: Biome
        run: npm run lint:biome

      - name: ast-grep
        run: npm run lint:ast-grep

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install dependencies
        run: deno install

      - name: Install npm dependencies
        run: npm ci

      - name: Type check
        run: deno check mod.ts tests/fixtures/probes/ scripts/*.ts

      - name: Type check react
        run: npm run check:react

      - name: Verify publish bundle
        run: deno task verify:publish

      - name: Install studio dependencies
        run: npm --prefix studio ci

      - name: Studio tests
        run: npm --prefix studio test

      - name: Build studio package
        run: npm run build:npm:studio

      # The suite runs once, with coverage, and Fallow scores the change against it.
      # Fallow resolves the react package's script bins (e.g. `astryx`), installed by check:react.
      - name: Test and Fallow
        run: npm run lint:fallow
        env:
          FALLOW_AUDIT_BASE: origin/${{ github.base_ref || github.event.repository.default_branch }}

  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install dependencies
        run: deno install

      - name: Assert deno.lock is committed
        run: |
          if ! git diff --exit-code deno.lock; then
            echo "::error::deno.lock is out of sync with deno.json. Run 'deno install' and commit deno.lock."
            exit 1
          fi

      - name: Verify publish bundle
        run: deno task verify:publish

      - name: Dry-run JSR publish
        run: deno publish --dry-run

      - name: Build npm package
        run: npm run build:npm

      - name: Dry-run npm publish
        working-directory: npm
        run: |
          npm version "0.0.0-pr.${GITHUB_RUN_ID}" --no-git-tag-version
          npm publish --dry-run --access public --tag ci-validate

      - name: Build React package
        run: |
          npm ci
          npm --prefix react ci
          npm run build:npm:react

      - name: Dry-run React npm publish
        working-directory: react/npm
        run: |
          npm version "0.0.0-pr.${GITHUB_RUN_ID}" --no-git-tag-version
          npm publish --dry-run --access public --tag ci-validate

      - name: Test and build studio package
        run: |
          npm --prefix studio ci
          npm --prefix studio test
          npm run build:npm:studio

      - name: Dry-run studio npm publish
        working-directory: studio/npm
        run: |
          npm version "0.0.0-pr.${GITHUB_RUN_ID}" --no-git-tag-version
          npm publish --dry-run --access public --tag ci-validate

  preview:
    needs: [lint, check, publish-dry-run]
    if: github.event_name == 'push' && github.ref_name != 'main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm-preview.yml
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
