name: CI

on:
  push:
    # A release branch is named for its version (0.3.4); a passing push publishes an npm preview.
    branches: [main, '[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install dependencies
        run: deno install

      - name: Install npm lint tools
        run: npm ci

      - name: Docs truth
        run: npm run lint:docs
        env:
          THEOREM_DOCS_BASE: origin/${{ github.base_ref || github.event.repository.default_branch }}

      - name: Deno lint
        run: deno lint

      - name: Biome
        run: npm run lint:biome

      - name: ast-grep
        run: npm run lint:ast-grep

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install dependencies
        run: deno install

      - name: Install npm dependencies
        run: npm ci

      - name: Type check
        run: deno check mod.ts tests/fixtures/probes/ scripts/*.ts

      - name: Type check react
        run: npm run check:react

      - name: Verify publish bundle
        run: deno task verify:publish

      - name: Install studio dependencies
        run: npm --prefix studio ci

      - name: Studio tests
        run: npm --prefix studio test

      - name: Build studio package
        run: npm run build:npm:studio

  # The tests are type-checked once here, so each shard runs them without checking again.
  test-types:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          deno install
          npm ci
          npm --prefix web ci
          npm --prefix react ci
          npm --prefix studio ci

      - name: Type check tests
        run: deno check $(node scripts/test-shard.mjs 0 1)

  # The suite runs once, split across shards, with coverage for Fallow's scores.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          deno install
          npm ci
          npm --prefix web ci
          npm --prefix react ci
          npm --prefix studio ci
          npm run build:npm:studio

      - name: Test shard ${{ matrix.shard }}
        run: deno test --parallel --no-check --allow-read --allow-write --allow-net --allow-env --allow-sys --allow-run --coverage=coverage-raw $(node scripts/test-shard.mjs ${{ matrix.shard }} 3)

      - name: Keep coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.shard }}
          path: coverage-raw/*.json
          retention-days: 1

  # Fallow scores the change against the shards' coverage, gathered into one.
  # Fallow resolves the react package's script bins (e.g. `astryx`), installed with react.
  fallow:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          deno install
          npm ci
          npm --prefix web ci
          npm --prefix react ci

      - name: Gather coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage-raw
          merge-multiple: true

      - name: Fallow
        run: |
          sh scripts/coverage.sh coverage-raw
          npm run fallow:audit
        env:
          FALLOW_AUDIT_BASE: origin/${{ github.base_ref || github.event.repository.default_branch }}

  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install dependencies
        run: deno install

      - name: Assert deno.lock is committed
        run: |
          if ! git diff --exit-code deno.lock; then
            echo "::error::deno.lock is out of sync with deno.json. Run 'deno install' and commit deno.lock."
            exit 1
          fi

      - name: Verify publish bundle
        run: deno task verify:publish

      - name: Dry-run JSR publish
        run: deno publish --dry-run

      - name: Build npm package
        run: npm run build:npm

      - name: Dry-run npm publish
        working-directory: npm
        run: |
          npm version "0.0.0-pr.${GITHUB_RUN_ID}" --no-git-tag-version
          npm publish --dry-run --access public --tag ci-validate

      - name: Build web package
        run: |
          npm ci
          npm --prefix web ci
          npm run build:npm:web

      - name: Dry-run web npm publish
        working-directory: web/npm
        run: |
          npm version "0.0.0-pr.${GITHUB_RUN_ID}" --no-git-tag-version
          npm publish --dry-run --access public --tag ci-validate

      - name: Build React package
        run: |
          npm --prefix react ci
          npm run build:npm:react

      - name: Dry-run React npm publish
        working-directory: react/npm
        run: |
          npm version "0.0.0-pr.${GITHUB_RUN_ID}" --no-git-tag-version
          npm publish --dry-run --access public --tag ci-validate

      - name: Test and build studio package
        run: |
          npm --prefix studio ci
          npm --prefix studio test
          npm run build:npm:studio

      - name: Dry-run studio npm publish
        working-directory: studio/npm
        run: |
          npm version "0.0.0-pr.${GITHUB_RUN_ID}" --no-git-tag-version
          npm publish --dry-run --access public --tag ci-validate

  preview:
    needs: [lint, check, test-types, fallow, publish-dry-run]
    if: github.event_name == 'push' && github.ref_name != 'main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm-preview.yml
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
