name: Publish JSR

on:
  push:
    branches: [main]
    paths:
      - deno.json
      - deno.lock
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check publish trigger
        id: version
        run: |
          CURRENT=$(jq -r '.version' deno.json)
          PREVIOUS=$(jq -r '.version' deno.json <<< "$(git show HEAD~1:deno.json 2>/dev/null || echo '{}')")
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          LOCK_CHANGED=false
          if ! git diff --quiet HEAD~1 HEAD -- deno.lock; then
            LOCK_CHANGED=true
          fi
          if [ "$CURRENT" != "$PREVIOUS" ] || [ "$LOCK_CHANGED" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: deno install

      - name: Assert deno.lock is committed
        run: |
          if ! git diff --exit-code deno.lock; then
            echo "::error::deno.lock is out of sync with deno.json. Run 'deno install' and commit deno.lock."
            exit 1
          fi

      - name: Verify publish bundle excludes artifacts
        run: deno task verify:publish

      - name: Check package
        run: deno check mod.ts

      - name: Publish to JSR
        run: deno publish
