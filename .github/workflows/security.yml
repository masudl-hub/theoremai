name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Snyk scans this repo through its GitHub integration, on its own schedule and on each PR, and
# reads the root .snyk policy. CLI tests here would spend the private-test quota a public repo
# doesn't need.
jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Semgrep
        run: python3 -m pip install --user semgrep==1.176.0

      - name: Semgrep scan (TypeScript + secrets rulesets)
        run: |
          semgrep scan \
            --config p/typescript \
            --config p/secrets \
            --metrics=off \
            --error \
            --exclude tests --exclude npm --exclude studio --exclude tmp \
            src react/src mod.ts scripts
