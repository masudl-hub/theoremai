id: no-console
language: TypeScript
severity: error
message: console is banned in Theorum kernel and providers. Tests assert; production code returns events.
files:
  - 'src/**/*.ts'
ignores:
  - 'src/cli/**/*.ts'
  # Corpus fuzz runners print human reports for CLI / deno task fuzz.
  - 'src/guardrails/corpus/fuzz-inbound.ts'
rule:
  pattern: console.$METHOD($$$ARGS)
