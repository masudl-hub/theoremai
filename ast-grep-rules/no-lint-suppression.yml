id: no-lint-suppression
language: TypeScript
severity: error
message: Lint suppressions are banned in Theorem. Fix the code.
rule:
  any:
    - pattern: '// biome-ignore $REST'
    - pattern: '// fallow-ignore $REST'
    - pattern: '// fallow-ignore-next-line $REST'
    - pattern: '// deno-lint-ignore $REST'
    - pattern: '// deno-lint-ignore-file $REST'
    - pattern: '// @ts-ignore'
    - pattern: '// @ts-nocheck'
    - pattern: '// @ts-expect-error $REST'
    - pattern: '/* eslint-disable $REST */'
    - pattern: '// eslint-disable-$REST'
